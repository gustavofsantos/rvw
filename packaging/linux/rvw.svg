<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4944"/>
      <stop offset="1" stop-color="#161614"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="range" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a30"/>
      <stop offset="1" stop-color="#e84400"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <path d="M120 76H392A44 44 0 0 1 436 120V320A44 44 0 0 1 392 364H196L128 426Q120 434 120 420V364A44 44 0 0 1 76 320V120A44 44 0 0 1 120 76Z" fill="url(#card)" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>
  <rect x="124" y="116" width="200" height="28" rx="14" fill="#8a8882"/>
  <rect x="104" y="172" width="304" height="104" rx="28" fill="#f54e00" opacity="0.8" filter="url(#glow)"/>
  <rect x="104" y="172" width="304" height="104" rx="28" fill="url(#range)"/>
  <rect x="136" y="194" width="196" height="24" rx="12" fill="#fff" opacity="0.92"/>

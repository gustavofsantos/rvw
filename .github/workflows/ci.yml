name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs these checks before it publishes

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings # same as the Makefile
      - run: cargo fmt --all --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.2 # same as the Makefile
      - run: cargo audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.0 # workspace.package.rust-version
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: bats-core/bats-action@4.0.0
      # sqlite3: test/rvw.bats. The lib*-dev packages: rvw-gui's tests link
      # against them (gpui); the same list as scripts/setup-dev.sh.
      - run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev
      - run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
      - run: cargo test --workspace --locked
      - run: bats test/rvw.bats

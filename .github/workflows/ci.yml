name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs these checks before it publishes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # same as the Makefile

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... # same as the Makefile

  test:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bats-core/bats-action@4.0.0
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
      - run: go vet ./...
      - run: go test -race ./...
      - run: bats test/rvw.bats

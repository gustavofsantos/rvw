name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux_arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: darwin_amd64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p rvw-cli --target ${{ matrix.target }}
        env:
          RVW_VERSION: ${{ github.ref_name }} # shown by rvw --version
      # The desktop app ships on Linux only for now: install.sh puts it, its
      # icon and its desktop entry under ~/.local.
      - name: Install the desktop app's build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev
      - if: runner.os == 'Linux'
        run: cargo build --release --locked -p rvw-gui --target ${{ matrix.target }}
      # No version in the archive name, so releases/latest/download/<name>
      # always resolves. install.sh depends on this.
      - run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/rvw README.md stage/
          files="rvw README.md"
          if [ "$RUNNER_OS" = Linux ]; then
            cp target/${{ matrix.target }}/release/rvw-gui stage/
            install -Dm644 packaging/linux/rvw.svg stage/share/icons/hicolor/scalable/apps/rvw.svg
            install -Dm644 packaging/linux/rvw.desktop stage/share/applications/rvw.desktop
            files="$files rvw-gui share"
          fi
          tar -czf rvw_${{ matrix.name }}.tar.gz -C stage $files
      - uses: actions/upload-artifact@v4
        with:
          name: rvw_${{ matrix.name }}
          path: rvw_${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum rvw_*.tar.gz > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --notes "Install or upgrade:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/gustavofsantos/rvw/main/install.sh | sh
          \`\`\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

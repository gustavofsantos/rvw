[package]
name = "rvw-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rvw-gui"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
rvw-core.workspace = true
rvw-git.workspace = true
rvw-store.workspace = true
rvw-view.workspace = true

# gpui compiles its Metal shaders at build time with `xcrun metal`, which only
# a full Xcode has. Compiled at startup instead, the Command Line Tools suffice.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2", features = ["runtime_shaders"] }

[dev-dependencies]
tempfile = "3"

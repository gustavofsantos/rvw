[workspace]
resolver = "2"
members = ["crates/rvw-core", "crates/rvw-git", "crates/rvw-store", "crates/rvw-render", "crates/rvw-cli", "crates/rvw-mcp", "crates/rvw-tui", "crates/rvw-view", "crates/rvw-gui"]

[workspace.package]
version = "0.0.0"
edition = "2021"
# The system rustc on some dev machines is 1.93; keep every non-GUI crate on it.
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
time = { version = "0.3", features = ["formatting"] }
rvw-core = { path = "crates/rvw-core" }
rvw-git = { path = "crates/rvw-git" }
rvw-store = { path = "crates/rvw-store" }
rvw-render = { path = "crates/rvw-render" }
rvw-cli = { path = "crates/rvw-cli" }
rvw-mcp = { path = "crates/rvw-mcp" }
rvw-tui = { path = "crates/rvw-tui" }
rvw-view = { path = "crates/rvw-view" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"   # every fallible fn returns the one documented Error type
must_use_candidate = "allow"   # noisy on query helpers
assert_is_empty = "allow"      # assert!(x.is_empty()) reads fine in tests
